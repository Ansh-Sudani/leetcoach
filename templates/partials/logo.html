{# Tree-arrow mark. `uid` keeps gradient ids unique when used more than once. #}
<svg class="logo-mark {{ cls }}" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <linearGradient id="tile-{{ uid }}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B3E45"/><stop offset="1" stop-color="#17181B"/>
    </linearGradient>
    <linearGradient id="chev-{{ uid }}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#B9BCC3"/>
    </linearGradient>
    <linearGradient id="dot-{{ uid }}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB02E"/><stop offset="1" stop-color="#F08A00"/>
    </linearGradient>
  </defs>
  <rect class="lm-tile" width="100" height="100" rx="24" fill="url(#tile-{{ uid }})"/>
  <g fill="none" stroke="url(#chev-{{ uid }})" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path class="lm-chev lm-chev-l" d="M34 31 L19 50 L34 69"/>
    <path class="lm-chev lm-chev-r" d="M66 31 L81 50 L66 69"/>
  </g>
  <g fill="none" stroke="#D9DBE0" stroke-width="2.6" stroke-linecap="round">
    <path class="lm-branch lm-trunk" pathLength="1" d="M50 70 L50 36"/>
    <path class="lm-branch lm-b1" pathLength="1" d="M50 50 L42 41"/>
    <path class="lm-branch lm-b2" pathLength="1" d="M50 50 L58 41"/>
    <path class="lm-branch lm-b3" pathLength="1" d="M50 59 L43.5 54"/>
    <path class="lm-branch lm-b4" pathLength="1" d="M50 59 L56.5 54"/>
  </g>
  <circle class="lm-dot lm-root" cx="50" cy="71.5" r="2.8" fill="#D9DBE0"/>
  <circle class="lm-dot lm-d3" cx="43" cy="53.5" r="2.6" fill="url(#dot-{{ uid }})"/>
  <circle class="lm-dot lm-d4" cx="57" cy="53.5" r="2.6" fill="url(#dot-{{ uid }})"/>
  <circle class="lm-dot lm-d1" cx="41.5" cy="40.5" r="3.4" fill="url(#dot-{{ uid }})"/>
  <circle class="lm-dot lm-d2" cx="58.5" cy="40.5" r="3.4" fill="url(#dot-{{ uid }})"/>
  <circle class="lm-dot lm-top" cx="50" cy="33" r="4.8" fill="url(#dot-{{ uid }})"/>
</svg>
