<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeetCoach</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="28" height="28" rx="7" fill="#ffa116"/>
        <path d="M10.5 8L6.5 14L10.5 20" stroke="#1a1a1a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M17.5 8L21.5 14L17.5 20" stroke="#1a1a1a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="brand-name">LeetCoach</span>
    </div>
    <p class="brand-tagline">Socratic hints. No spoilers.</p>
  </header>

  <main class="workspace">
    <section class="pane problem-pane">
      <div class="combobox" id="problem-combobox">
        <input
          id="problem-search"
          type="text"
          placeholder="Search problems by number or name..."
          autocomplete="off"
        />
        <ul id="problem-options" class="combobox-options" hidden></ul>
      </div>

      <div id="selected-problem" class="selected-problem" hidden>
        <span id="selected-problem-num" class="problem-num"></span>
        <span id="selected-problem-title" class="problem-title"></span>
        <span id="selected-problem-difficulty" class="badge"></span>
        <button id="mark-solved-btn" class="btn-ghost" hidden>Mark Solved</button>
      </div>

      <div id="problem-statement" class="problem-statement" hidden>
        <p id="problem-statement-text"></p>
        <div id="problem-examples" class="problem-examples"></div>
      </div>

      <details class="details-toggle">
        <summary>Paste full problem statement (optional — improves hint quality)</summary>
        <textarea id="problem-details-input" placeholder="Paste the problem description, examples, or constraints here..."></textarea>
      </details>

      <div class="hint-controls">
        <label for="language-select">Language</label>
        <select id="language-select">
          <option value="python">Python</option>
          <option value="javascript">JavaScript</option>
          <option value="java">Java</option>
          <option value="cpp">C++</option>
        </select>
        <label for="hint-level">Hint level</label>
        <select id="hint-level">
          <option value="1">1 → Guiding question</option>
          <option value="2">2 → Name the pattern</option>
          <option value="3">3 → Apply it to this problem</option>
          <option value="4">4 → Pseudocode structure</option>
        </select>
        <button id="hint-btn" disabled>Get Hint</button>
      </div>

      <div id="hint-feed" class="hint-feed">
        <p class="hint-feed-empty">Pick a problem, write some code, then ask for a hint or hit Submit to run it against test cases.</p>
      </div>
    </section>

    <section class="pane editor-pane">
      <div class="editor-header">
        <span>Solution Draft</span>
        <div class="editor-header-actions">
          <span id="language-note" class="language-note" hidden>Python only, for now</span>
          <button id="submit-btn" class="btn-primary" disabled>Submit</button>
        </div>
      </div>
      <textarea
        id="code-input"
        class="code-editor"
        spellcheck="false"
        placeholder="def solve():
    # start writing your draft here
    pass"
      ></textarea>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/display/placeholder.min.js"></script>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
